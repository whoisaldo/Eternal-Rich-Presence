name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint-test:
    name: Lint + tests (Linux, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the advertised minimum (pyproject targets py39); 3.13 is what
        # development happens on. Ruff's UP rules can't catch runtime use of
        # newer stdlib APIs, so the minimum actually runs the tests.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling (ruff + pytest only)
        # Linux runner deliberately installs NO runtime deps: pywin32 and
        # winrt-* are Windows-only (marked in requirements.txt) and the
        # pure-logic tests import only stdlib + first-party modules.
        run: python -m pip install --upgrade pip ruff==0.15.18 pytest
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest
        run: pytest -q

  test-windows:
    name: Tests (Windows, py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime deps + pytest
        run: python -m pip install --upgrade pip pytest -r requirements.txt
      - name: Pytest
        run: pytest -q
