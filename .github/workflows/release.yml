name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Release gate (lint + tests + version check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime deps + tooling
        run: python -m pip install --upgrade pip pytest ruff==0.15.18 -r requirements.txt
      - name: Ruff lint
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: Check tag matches app_info.APP_VERSION
        shell: pwsh
        run: |
          $v = (python -c "from app_info import APP_VERSION; print(APP_VERSION)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app_info.APP_VERSION ($v)"
          }

  build-release:
    name: Build exe + publish release
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build portable exe
        # build.ps1 installs its own deps (requirements.txt + pyinstaller) and
        # produces EternalRichPresence.exe at the repo root. Its flags are the
        # source of truth for the exe and are intentionally not overridden here.
        shell: pwsh
        run: .\build.ps1
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $h = Get-FileHash EternalRichPresence.exe -Algorithm SHA256
          "$($h.Hash)  EternalRichPresence.exe" | Set-Content SHA256SUMS.txt -Encoding ASCII
      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $out = @()
          $capture = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match "^##\s+\[$([regex]::Escape($version))\]") { $capture = $true; continue }
            if ($capture -and $line -match "^##\s+\[") { break }
            if ($capture) { $out += $line }
          }
          if (-not $out) { $out = @("Release ${{ github.ref_name }}") }
          Set-Content -Path release_notes.md -Value $out -Encoding UTF8
      - name: Publish GitHub Release
        # Pinned by commit SHA (tag v2): this workflow has contents:write and
        # publishes user-facing binaries, so mutable action refs are out.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            EternalRichPresence.exe
            SHA256SUMS.txt
          body_path: release_notes.md
